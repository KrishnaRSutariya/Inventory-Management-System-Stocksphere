version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: inventory_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: inventory_management
    volumes:
      - mongo_data:/data/db
    networks:
      - inventory_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: inventory_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/inventory_management
      JWT_SECRET: super_secure_jwt_secret_key_change_in_production
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - inventory_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: inventory_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - inventory_network

volumes:
  mongo_data:
    driver: local

networks:
  inventory_network:
    driver: bridge
